    "Rijksuniversiteit Groningen" and technical contact cit-iam@list.rug.nl. The entity is registered
    in eduGAIN with SURFconext as registration authority, alongside a second University-registered
    service provider at enlight.hpc.rug.nl. Machine-readable, institution-operated by definition, and
    the surface class this cohort almost never has catalogued. The software is NetIQ Access Manager,
    not Shibboleth.
