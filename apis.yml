  x-operator: institution
  description: >-
    The JSON backend behind Ocasys, the University's own course and degree-programme catalog.
    Verified live 2026-08-30 with no credentials: course search, full course records, the catalog
    page projection, programme search, faculties and organizational units, controlled option lists
    and the academic-year list all return 200 to an anonymous GET. Course records are bilingual and
    carry ECTS credits, study level, assessments, formats, prerequisites, offerings, ENLIGHT alliance
    status and per-course UN Sustainable Development Goal flags. Enrollment, permission and
    course-offering paths in the same namespace return 403 without an institutional SAML session and
    are documented as gated, not as callable. This is the one genuinely institution-engineered API
