  name: University of Groningen Identity Provider (SURFconext / eduGAIN)
  x-operator: institution
  description: >-
    The University runs its own SAML 2.0 identity provider and publishes signed federation metadata
    at signon.rug.nl for entityID https://signon.rug.nl/nidp/saml2/metadata. Verified live
    2026-08-30: 25KB of XML carrying IDPSSODescriptor, SPSSODescriptor and AttributeAuthorityDescriptor
