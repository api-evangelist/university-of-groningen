    Keyless OAI-PMH 2.0 metadata-harvesting endpoint operated by the University on its own domain.
    Verified live 2026-08-30: Identify reports protocolVersion 2.0, repositoryName "University of
    Groningen Research Database", adminEmail pure@rug.nl, earliest datestamp 2014-03-11,
    deletedRecord "no" and second-level granularity; ListIdentifiers over oai_dc reports a
    completeListSize of 1,521,703. Six metadata prefixes are offered — oai_cerif_openaire, qdc,
    oai_dc, nl_didl, mods, xmetadiss — and the set hierarchy follows the OpenAIRE CRIS entity model
