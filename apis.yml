x-coverage:
  state: covered
  reason: covered
  detail: >-
    The University of Groningen operates no API programme and this profile now says so, while also
    naming the three surfaces it genuinely does run. What was catalogued here on 2026-06-03 was two
    vendors' contracts wearing the University's name: one Elsevier Pure REST specification and one
    DataverseNL Native API specification, split by refine-openapis into seventy-three per-tag
    documents and registered as seventy-three separate "University of Groningen <tag> API" entries —
    every one of them carrying the same fabricated baseURL, https://pure.rug.nl/ws/oai, which is the
    OAI-PMH endpoint and serves none of those paths. Thirty-six of the specifications describe
    dataverse.nl, a host the University does not own. The Pure specification's own contact address
    was pure-support@elsevier.com; Dataverse titles in this repo are shipped by up to eight other
    institutions in this catalog. All seventy-three specifications, their two source documents, 145
    collections, and every schema, structure, example, ruleset, vocabulary, JSON-LD context and
    agentic-access file derived from them were removed on 2026-08-30 — 235 files. In their place:
    the Ocasys course-catalog API, found by reading the catalog application's own JavaScript bundle
    and confirmed keyless against live endpoints; the OAI-PMH endpoint, re-verified with all six
    verbs; and the SAML identity provider, confirmed against its published metadata and its eduGAIN
    registration. The two OpenAPIs now in this repo are DERIVED by API Evangelist from those probes
    and are labelled as such — the University publishes neither. Institutional AI posture was found
    only on the Dutch-language surface, at the CIT AI Office pages.
