aid: university-of-groningen
name: University of Groningen
description: >-
  The University of Groningen (Rijksuniversiteit Groningen, RUG/UG) is a public research university
  in Groningen, the Netherlands, founded in 1614. Measured honestly, it runs no API programme:
  there is no developer portal, no api.rug.nl, no status page, no published versioning or
  deprecation policy, and no first-party OpenAPI anywhere on its estate — api.rug.nl, data.rug.nl,
  developer.rug.nl and status.rug.nl do not resolve at all. What it does operate, on its own
  domain, is a small set of real programmable surfaces: the Ocasys course and degree-programme
  catalog, whose JSON backend at ocasys.rug.nl/api answers unauthenticated course search,
  full course records, programme search, faculties and controlled option lists, and emits RFC 9457
  problem details on error; a keyless OAI-PMH 2.0 endpoint at pure.rug.nl/ws/oai serving 1,521,703
  identifiers across six metadata profiles including OpenAIRE CERIF 1.2 with resolvable ORCID iDs;
  and its own SAML 2.0 identity provider at signon.rug.nl, registered in eduGAIN through SURFconext.
  Everything else that looks like a University of Groningen API is a purchase. The CRIS is Elsevier
  Pure, research data lives in a collection inside the shared national DataverseNL installation that
  DANS and SURF operate, and library discovery is OCLC WorldCat. Those are recorded here as tenant
  relationships, not as the University's engineering.
