  - date: '2026-06-03'
    rating: 2
    summary: >-
      Verified live, machine-readable interfaces are research-oriented: the Pure
      research-portal OAI-PMH endpoint returned a valid OAI-PMH XML response
      (OpenAIRE CERIF profile) for ListMetadataFormats, the Elsevier Pure REST
      web-services API is live but API-key gated (HTTP 401 without
      credentials), and the shared DataverseNL Native REST API (UG default data
      repository) returned a valid version payload (Dataverse v6.9). The
      official rijksuniversiteit-groningen GitHub org exists and publishes
      open-source research-data/education tooling (iBridges/iRODS Python client,
      datacite test, LTI 1.3). No unified self-service public developer portal
      and no public key-issuing program were found; SIS/timetable/identity APIs
      appear internal. No endpoints fabricated; gated/error states reported
      honestly.
    endpoints:
