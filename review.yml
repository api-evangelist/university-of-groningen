      - url: https://ocasys.rug.nl/api/orgunit/faculties-and-universities
        status: 200
        note: One UNIVERSITY root plus fifteen faculties.
      - url: https://ocasys.rug.nl/api/2026-2027/program
        status: 400
        note: RFC 9457 problem detail when the required searchTerm is omitted.
      - url: https://ocasys.rug.nl/api/2026-2027/course-offering?permission=READ
        status: 403
        note: Gated behind institutional SAML SSO; empty body, no WWW-Authenticate hint.
      - url: https://pure.rug.nl/ws/oai?verb=Identify
        status: 200
        note: >-
          protocolVersion 2.0, repositoryName "University of Groningen Research Database",
