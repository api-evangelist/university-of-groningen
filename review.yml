  - date: '2026-08-30'
    rating: 2
    summary: >-
      Re-profiled under the university pipeline, which settles operator attribution before saving
      any contract. The 2026-06-03 profile credited the University with 73 OpenAPI specifications;
      all 73 were per-tag splits of two vendor contracts — the Elsevier Pure REST API (info contact
      pure-support@elsevier.com) and the DataverseNL Native API (servers dataverse.nl, a host the
      University does not own and that at least seven other institutions in this catalog also point
      at) — and every one of them carried the same fabricated baseURL, https://pure.rug.nl/ws/oai,
      which is the OAI-PMH endpoint and serves none of those paths. All 73 specifications, their two
      source documents, 145 collections and every derived schema, structure, example, ruleset,
      vocabulary, JSON-LD context and agentic-access file were removed — 235 files. Three genuinely
      institution-operated surfaces were found and verified in their place: the previously
      uncatalogued Ocasys course-catalog JSON API, discovered by reading the catalog application's
      own JavaScript bundle and confirmed keyless; the OAI-PMH endpoint, re-verified across all six
      verbs (the 2026-06 Identify 500 did not reproduce — it returns 200); and the University's own
      SAML 2.0 identity provider, confirmed against its published metadata and its eduGAIN
      registration through SURFconext. Pure, DataverseNL and OCLC WorldCat are retained as tenant
      relationships. No developer portal, no key issuance, no status page; api.rug.nl, data.rug.nl,
      developer.rug.nl and status.rug.nl do not resolve. The two OpenAPIs now in this repository are
      derived by API Evangelist from live probes and are labelled as such. Nothing fabricated.
    endpoints:
      - url: https://ocasys.rug.nl/api/2026-2027/course?searchTerm=biology
        status: 200
        note: Keyless course search on the institution's own course-catalog backend.
      - url: https://ocasys.rug.nl/api/2026-2027/course/WMMB015-05
        status: 200
