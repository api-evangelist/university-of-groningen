openapi: 3.2.0
info:
  title: Dataverse Localcontexts API
  description: Open source research data repository software.
  version: '6.9'
servers:
- url: https://dataverse.nl
tags:
- name: Localcontexts
paths:
  /localcontexts/datasets/{id}:
    get:
      operationId: LocalContexts_getDatasetLocalContexts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      tags:
      - Localcontexts
  /localcontexts/datasets/{id}/{projectId}:
    get:
      operationId: LocalContexts_searchLocalContexts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      tags:
      - Localcontexts
